name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Unzip project and fix spec
        run: |
          unzip -q *.zip
          cd bros_led_app
          sed -i 's/^requirements *=.*/requirements = python3,kivy==2.3.0,pillow,ffpyplayer/' buildozer.spec
          sed -i 's/^p4a.branch *=.*/p4a.branch = v2024.01.21/' buildozer.spec
          sed -i 's/^log_level *=.*/log_level = 2/' buildozer.spec
          sed -i 's/^android.ndk *=.*/android.ndk = 25b/' buildozer.spec
          if ! grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi
          grep -n "^requirements\|^p4a\|^log_level\|^android" buildozer.spec

      - name: Build APK (with intro video)
        id: build1
        continue-on-error: true
        working-directory: bros_led_app
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../build1.log

      - name: Show error summary (attempt 1)
        if: steps.build1.outcome == 'failure'
        run: |
          echo "=========== ERROR LINES ==========="
          grep -n -i -E "error|failed|fatal|undefined reference|No such file" build1.log | tail -40 || true
          echo "=========== LAST 60 LINES ==========="
          tail -60 build1.log

      - name: Build APK (fallback without video)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        working-directory: bros_led_app
        run: |
          set -o pipefail
          sed -i 's/,ffpyplayer//' buildozer.spec
          grep -n "^requirements" buildozer.spec
          buildozer android clean || true
          buildozer -v android debug 2>&1 | tee ../build2.log

      - name: Show error summary (attempt 2)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        run: |
          echo "=========== ERROR LINES ==========="
          grep -n -i -E "error|failed|fatal|undefined reference|No such file" build2.log | tail -40 || true
          echo "=========== LAST 60 LINES ==========="
          tail -60 build2.log

      - name: Note when video is missing
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'success'
        run: echo "::warning::APK was built WITHOUT the intro video (fallback). Logo animation will show instead."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BROS-LED-APK
          path: bros_led_app/bin/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-LOGS
          path: build*.log
          if-no-files-found: ignore
