name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Unzip project and fix spec
        run: |
          unzip -q *.zip
          cd bros_led_app
          sed -i 's/^title *=.*/title = BROS LED Controller/' buildozer.spec
          sed -i 's/^requirements *=.*/requirements = python3,kivy==2.3.0,pillow,ffpyplayer/' buildozer.spec
          sed -i 's/^p4a.branch *=.*/p4a.branch = v2024.01.21/' buildozer.spec
          sed -i 's/^log_level *=.*/log_level = 2/' buildozer.spec
          sed -i 's/^android.ndk *=.*/android.ndk = 25b/' buildozer.spec
          if ! grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          fi
          grep -n "^title\|^requirements\|^p4a\|^android" buildozer.spec

      - name: Build APK
        working-directory: bros_led_app
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee ../build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "=========== ERROR LINES ==========="
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -n -i -E "Failed to flatten|BUILD FAILED|fatal error|Command failed|What went wrong" | tail -30 || true
          echo "=========== LAST 60 LINES ==========="
          tail -60 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BROS-LED-APK
          path: bros_led_app/bin/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-LOGS
          path: build.log
          if-no-files-found: ignore
